name: Codex CI
'on':
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Codex verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: "Syntaxe Python et JavaScript des sources"
        run: |
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          checked = 0
          for name in files:
              if not name:
                  continue
              p = Path(name)
              if len(p.parts) > 1 and p.parts[0] not in {'src', 'scripts', 'extension', 'demo'}:
                  continue
              if p.suffix == '.py':
                  ast.parse(p.read_text(encoding='utf-8-sig'), filename=name)
                  checked += 1
              elif p.suffix in {'.js', '.mjs', '.cjs'}:
                  subprocess.run(['node', '--check', name], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit('No source files verified; configure the checks for this project.')
          print(f'{checked} source files passed syntax verification; browser and integration tests are separate.')
          PY
